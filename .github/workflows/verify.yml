name: Verify & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (backend)
        run: cd backend && npm ci

      - name: Install dependencies (frontend)
        run: cd frontend && npm ci

      - name: Run tests
        run: npm test

      - name: Run linting
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Verify release gates
        run: npm run verify
        continue-on-error: true

      - name: Check Supabase schema
        run: npm run check:supabase
        continue-on-error: true

      - name: Verify installation (clean lockfiles)
        run: npm run verify:install
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage/
          retention-days: 30

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: npm audit (backend)
        run: cd backend && npm audit --production || true

      - name: npm audit (frontend)
        run: cd frontend && npm audit --production || true

      - name: Check for exposed secrets
        run: |
          if grep -r "AUTH_SECRET.*=" backend/.env 2>/dev/null; then
            echo "⚠️ WARNING: AUTH_SECRET found in .env - should use env vars only"
            exit 1
          fi
          exit 0

  build-and-deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend build
        run: cd frontend && npm install && npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "❌ Frontend build failed: dist/ not found"
            exit 1
          fi
          echo "✅ Frontend build successful"
          ls -lh frontend/dist/

      - name: Backend startup check
        run: |
          cd backend && npm install
          timeout 5 node server.js &
          sleep 3
          curl -s http://localhost:4000/api/health || true
          exit 0
